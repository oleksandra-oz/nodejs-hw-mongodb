tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Creates a new contact for the authenticated user with an optional photo upload.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: '../../components/schemas.yaml#/Contact'
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/ContactResponse'
  '400':
    $ref: '../../components/responses.yaml#/BadRequest'
  '401':
    $ref: '../../components/responses.yaml#/Unauthorized'
  '500':
    $ref: '../../components/responses.yaml#/ServerError'
