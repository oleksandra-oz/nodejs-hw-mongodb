BadRequest:
  description: Bad request due to invalid parameters
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: Invalid contact ID

Unauthorized:
  description: Unauthorized access
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: User not authenticated

NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: Contact not found

ServerError:
  description: Internal server error
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: Failed to upload photo to Cloudinary